# .github/workflows/deploy.yml
#
# Production deployment:
#   Next.js 16 static export (SSG)
#       ->
#   GitHub Pages
#       ->
#   sapnashrijewellers.in
#
# Deployment flow:
#
#   GitHub main branch
#          |
#          v
#   Ubuntu GitHub-hosted runner
#          |
#          +--> npm ci
#          |
#          +--> npm run data-sync
#          |       |
#          |       +--> Google Apps Script / Google Sheets
#          |       |
#          |       +--> generates files under /data
#          |
#          +--> npm run build
#          |       |
#          |       +--> Next.js static export
#          |       +--> generates /out
#          |
#          +--> add CNAME + .nojekyll
#          |
#          +--> upload GitHub Pages artifact
#          |
#          +--> deploy to GitHub Pages
#
# IMPORTANT:
# - No Turborepo
# - No catalog directory
# - No gh-pages package
# - No gh-pages branch
# - Generated files are NOT committed back to the repository
# - main remains the source of truth
# - Deployment is manually triggered from GitHub Actions
#

name: Deploy to Production

# ---------------------------------------------------------------------------
# TRIGGERS
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:

# ---------------------------------------------------------------------------
# GLOBAL PERMISSIONS
# ---------------------------------------------------------------------------

permissions:
  contents: read
  pages: write
  id-token: write

# ---------------------------------------------------------------------------
# CONCURRENCY
# ---------------------------------------------------------------------------

concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:

  # =========================================================================
  # BUILD
  # =========================================================================

  build:
    name: Build static Next.js site
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      # ---------------------------------------------------------------------
      # Checkout repository
      # ---------------------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v6

      # ---------------------------------------------------------------------
      # Setup Node.js
      # ---------------------------------------------------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"

      # ---------------------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------------------

      - name: Install npm dependencies
        run: npm ci
      
      # ---------------------------------------------------------------------
      # Create Next.js production environment
      # ---------------------------------------------------------------------

      - name: Create production environment
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
          NEXT_PUBLIC_BASE_IMAGE_URL=${{ vars.NEXT_PUBLIC_BASE_IMAGE_URL }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGEBUCKET=${{ vars.NEXT_PUBLIC_FIREBASE_STORAGEBUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID=${{ vars.NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENTID=${{ vars.NEXT_PUBLIC_FIREBASE_MEASUREMENTID }}
          NEXT_PUBLIC_WORKER_URL=${{ vars.NEXT_PUBLIC_WORKER_URL }}
          EOF

      # ---------------------------------------------------------------------
      # Verify required production configuration
      # ---------------------------------------------------------------------

      - name: Verify production configuration
        run: |
          required_vars=(
            NEXT_PUBLIC_BASE_URL
            NEXT_PUBLIC_BASE_IMAGE_URL
            NEXT_PUBLIC_FIREBASE_API_KEY
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
            NEXT_PUBLIC_FIREBASE_PROJECT_ID
            NEXT_PUBLIC_FIREBASE_APP_ID
            NEXT_PUBLIC_FIREBASE_STORAGEBUCKET
            NEXT_PUBLIC_FIREBASE_MESSAGINGSENDERID
            NEXT_PUBLIC_FIREBASE_MEASUREMENTID
            NEXT_PUBLIC_WORKER_URL
          )

          for variable in "${required_vars[@]}"; do
            if ! grep -qE "^${variable}=.+" .env.production; then
              echo "::error::$variable is missing or empty in .env.production."
              exit 1
            fi
          done

          echo "All required production variables are available."
      # ---------------------------------------------------------------------
      # Generate latest website data
      # ---------------------------------------------------------------------

      - name: Fetch latest product data from Google
        run: npm run data-sync

      # ---------------------------------------------------------------------
      # Build Next.js static site
      # ---------------------------------------------------------------------

      - name: Build Next.js static site
        run: npm run build

      # ---------------------------------------------------------------------
      # Verify Next.js output
      # ---------------------------------------------------------------------

      - name: Verify Next.js output
        run: |
          if [ ! -d "out" ]; then
            echo "::error::Next.js did not generate the out directory."
            exit 1
          fi

          if [ ! -f "out/index.html" ]; then
            echo "::error::out/index.html was not generated."
            exit 1
          fi

          echo "Static site generated successfully."
          echo "Output size:"
          du -sh out

      # ---------------------------------------------------------------------
      # Configure custom domain
      # ---------------------------------------------------------------------

      - name: Configure custom domain
        run: |
          echo "sapnashrijewellers.in" > out/CNAME

      # ---------------------------------------------------------------------
      # Disable Jekyll processing
      # ---------------------------------------------------------------------

      - name: Disable Jekyll processing
        run: |
          touch out/.nojekyll

      # ---------------------------------------------------------------------
      # Configure GitHub Pages
      # ---------------------------------------------------------------------

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # ---------------------------------------------------------------------
      # Upload GitHub Pages artifact
      # ---------------------------------------------------------------------

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./out"

  # =========================================================================
  # DEPLOY
  # =========================================================================

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ---------------------------------------------------------------------
      # Deploy artifact to GitHub Pages
      # ---------------------------------------------------------------------

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4